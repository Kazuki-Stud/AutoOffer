import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java'
    id 'jacoco'
    id 'checkstyle'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'lt.ehu'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

sourceSets {
    main {
        java { srcDirs = ['main/java'] }
        resources { srcDirs = ['main/resources'] }
    }
    test {
        java { srcDirs = ['test/java'] }
        resources { srcDirs = ['test/resources'] }
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    // Раскомментируйте только если релизная версия Lombok ещё не поддерживает JDK 26:
    // maven { url = 'https://projectlombok.org/edge-releases' }
}

ext {
    // Проверьте последнюю версию с поддержкой JDK 26 на projectlombok.org/download
    // (для edge-репозитория: 'edge-SNAPSHOT')
    lombokVersion = '1.18.42'
}

dependencies {
    def springBootBom = platform(SpringBootPlugin.BOM_COORDINATES)
    implementation springBootBom
    runtimeOnly springBootBom
    annotationProcessor springBootBom
    testImplementation springBootBom

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
implementation 'org.springframework.boot:spring-boot-starter-cache'
implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.postgresql:postgresql'

    // Prometheus metrics (/actuator/prometheus)
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // JWT для администраторов
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Структурированные JSON-логи в stdout для Docker/production
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testRuntimeOnly 'com.h2database:h2'
}

jacoco {
    toolVersion = '0.8.14'
}

checkstyle {
    toolVersion = '10.21.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

def jacocoXmlFile = layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml')

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
    doFirst {
        def xmlFile = jacocoXmlFile.get().asFile
        if (xmlFile.exists()) {
            def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
            factory.setFeature('http://apache.org/xml/features/nonvalidating/load-external-dtd', false)
                def doc = factory.newDocumentBuilder().parse(xmlFile)
                def children = doc.documentElement.childNodes
                for (int i = 0; i < children.length; i++) {
                    def node = children.item(i)
                    if (node.nodeName == 'counter') {
                        def type = node.attributes.getNamedItem('type')?.nodeValue
                        if (type == 'LINE' || type == 'BRANCH') {
                            long missed = node.attributes.getNamedItem('missed').nodeValue as long
                            long covered = node.attributes.getNamedItem('covered').nodeValue as long
                            long total = missed + covered
                            double pct = total > 0 ? (covered * 100.0d / total) : 0.0d
                            println String.format('JaCoCo %s coverage: %d/%d (%.2f%%)', type, covered, total, pct)
                        }
                    }
                }
            }
        }
    }

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
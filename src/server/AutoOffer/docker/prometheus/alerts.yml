groups:
  - name: autooffer-alerts
    rules:
      - alert: AutoOfferServiceDown
        expr: up{job="autooffer-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "AutoOffer backend is unreachable"
          description: "Prometheus cannot scrape /actuator/prometheus on app:8080 for > 1 minute."

      - alert: AutoOfferHighHttp5xxRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Elevated HTTP 5xx error rate on AutoOffer"
          description: "HTTP 5xx rate exceeded 0.05 req/s over the last 5 minutes."

      - alert: AutoOfferHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 request latency (> 1s)"
          description: "95th percentile HTTP request latency exceeded 1.0s."

      - alert: AutoOfferJvmHeapHigh
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM heap usage above 85%"
          description: "AutoOffer JVM heap usage has remained above 85% for 5 minutes."

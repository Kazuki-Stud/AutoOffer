server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-autooffer
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(autooffer-.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_name"]
        regex: "/?(autooffer-.*)"
        action: keep
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            logger: logger_name
            requestId: requestId
            message: message
      - labels:
          level:
          requestId:

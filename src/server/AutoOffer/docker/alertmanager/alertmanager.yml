global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 3h
  receiver: "default-webhook"

receivers:
  - name: "default-webhook"
    webhook_configs:
      - url: "http://localhost:9999/alerts"
        send_resolved: true

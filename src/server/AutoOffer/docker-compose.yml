services:
  postgres:
    image: postgres:16.6-alpine
    container_name: autooffer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_SUPERUSER}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - db-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_SUPERUSER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "work_mem=2MB", "-c", "max_connections=50"]
    deploy:
    resources:
    limits:
    cpus: "0.75"
    memory: 256M

    clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: autooffer-clickhouse
    restart: unless-stopped
    environment:
    CLICKHOUSE_DB: ${CH_DB}
    CLICKHOUSE_USER: ${CH_USER}
    CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
    CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
    - ch_data:/var/lib/clickhouse
    - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    - ./docker/clickhouse/config/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    networks:
    - db-internal
    healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      deploy:
      resources:
      limits:
      cpus: "0.75"
      memory: 384M

      redis:
      image: redis:7.4-alpine
      container_name: autooffer-redis
      restart: unless-stopped
      command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
      networks:
      - db-internal
      healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      deploy:
      resources:
      limits:
      cpus: "0.25"
      memory: 64M

      app:
      build:
      context: .
      dockerfile: Dockerfile
      image: ${APP_IMAGE:-autooffer-server:0.1.0}
      container_name: autooffer-server
      restart: unless-stopped
      depends_on:
      postgres:
      condition: service_healthy
      clickhouse:
      condition: service_healthy
      redis:
      condition: service_healthy
      ports:
      - "${SERVER_PORT:-8080}:8080"
      environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_MIGRATOR_USER: ${DB_MIGRATOR_USER}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      DEVICE_TOKEN_PEPPER: ${DEVICE_TOKEN_PEPPER}
      CH_URL: http://clickhouse:8123
      CH_DB: ${CH_DB}
      CH_USER: ${CH_USER}
      CH_PASSWORD: ${CH_PASSWORD}
      networks:
      - db-internal
      - app-public
      healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/liveness"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 40s
        stop_grace_period: 25s
        deploy:
        resources:
        limits:
        cpus: "1.0"
        memory: 384M

        prometheus:
        image: prom/prometheus:v2.54.1
        container_name: autooffer-prometheus
        restart: unless-stopped
        command:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=3d"
        volumes:
        - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
        - prom_data:/prometheus
        networks:
        - db-internal
        depends_on:
        - app
        deploy:
        resources:
        limits:
        cpus: "0.25"
        memory: 160M

        alertmanager:
        image: prom/alertmanager:v0.27.0
        container_name: autooffer-alertmanager
        restart: unless-stopped
        volumes:
        - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
        networks:
        - db-internal
        deploy:
        resources:
        limits:
        cpus: "0.15"
        memory: 48M

        loki:
        image: grafana/loki:3.1.0
        container_name: autooffer-loki
        restart: unless-stopped
        command: -config.file=/etc/loki/loki-config.yml
        volumes:
        - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
        - loki_data:/loki
        networks:
        - db-internal
        deploy:
        resources:
        limits:
        cpus: "0.25"
        memory: 160M

        promtail:
        image: grafana/promtail:3.1.0
        container_name: autooffer-promtail
        restart: unless-stopped
        command: -config.file=/etc/promtail/promtail-config.yml
        volumes:
        - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
        - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
        - db-internal
        depends_on:
        - loki
        deploy:
        resources:
        limits:
        cpus: "0.15"
        memory: 64M

        grafana:
        image: grafana/grafana:11.2.0
        container_name: autooffer-grafana
        restart: unless-stopped
        ports:
        - "${GRAFANA_PORT:-3000}:3000"
        environment:
        GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
        GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
        volumes:
        - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
        - grafana_data:/var/lib/grafana
        networks:
        - db-internal
        - app-public
        depends_on:
        - prometheus
        - loki
        deploy:
        resources:
        limits:
        cpus: "0.25"
        memory: 160M

volumes:
  pg_data:
  ch_data:
  prom_data:
  loki_data:
  grafana_data:

networks:
  db-internal:
    internal: true
  app-public:
    driver: bridge
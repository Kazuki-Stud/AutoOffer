server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: AutoOffer
  config:
    import: optional:file:.env[.properties],optional:file:src/server/AutoOffer/.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 5s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autooffer_db}?currentSchema=autooffer
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    user: ${DB_MIGRATOR_USER}
    password: ${DB_MIGRATOR_PASSWORD}
    default-schema: public

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: autooffer
        format_sql: false

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    device-token-pepper: ${DEVICE_TOKEN_PEPPER}

  clickhouse:
    url: ${CH_URL:http://localhost:8123}
    database: ${CH_DB:autooffer_olap}
    username: ${CH_USER:autooffer_etl}
    password: ${CH_PASSWORD}
  etl:
    enabled: true
    batch-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

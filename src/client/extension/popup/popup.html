<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AutoOffer Popup</title>
    <link rel="stylesheet" href="popup.css">
    <script src="kit.js" defer></script>
</head>
<body>
<div class="header-container">
    <div class="brand-row">
        <h3 data-i18n="popupTitle">AutoOffer</h3>
        <div class="lang-container">
            <select id="lang-select">
                <option value="en">EN</option>
                <option value="lt">LT</option>
                <option value="ru">RU</option>
            </select>
        </div>
    </div>
    <div class="system-metrics-bar">
        <span id="badge-weight" class="metric-pill">Weight: 0 KB</span>
        <span id="badge-job-status" class="metric-pill">Jobs: Idle</span>
    </div>
</div>

<nav class="tab-nav">
    <button id="tab-btn-jobs" class="tab-link active" data-tab="tab-jobs">Jobs</button>
    <button id="tab-btn-websites" class="tab-link" data-tab="tab-websites">Websites & Settings</button>
    <button id="tab-btn-profile" class="tab-link" data-tab="tab-profile">Profile</button>
</nav>

<div id="tab-jobs" class="tab-pane active">
    <div class="pane-section">
        <div class="section-title-row">
            <h4>Select Job</h4>
            <button id="btn-toggle-job-form" class="text-toggle-btn">+ Create Job</button>
        </div>
        <div class="form-group">
            <select id="job-select" class="form-select">
                <option value="">Default Quick Run</option>
            </select>
        </div>

        <div id="job-editor-box" class="sub-card-box" style="display: none;">
            <h5 id="editor-heading">New Job Configuration</h5>
            <div class="form-group">
                <label>Target Websites</label>
                <div id="job-websites-picker" class="websites-picker-grid"></div>
            </div>
            <div class="form-group">
                <label>Profile to Use:</label>
                <select id="job-form-profile" class="form-select">
                    <option value="">Default Profile</option>
                </select>
            </div>
            <div class="form-group">
                <label>Submission Mode:</label>
                <select id="job-form-mode" class="form-select">
                    <option value="semi">Semi-Automated</option>
                    <option value="autonomous">Full Autonomous</option>
                </select>
            </div>
            <div id="job-autonomous-warning" class="warning-box" style="display: none;">
                <label class="checkbox-label">
                    <input type="checkbox" id="job-confirm-autonomous" />
                    <span>Confirm autonomous submission on target platforms without manual review</span>
                </label>
            </div>
            <div class="form-group">
                <label>Fields Extraction:</label>
                <select id="job-form-fields" class="form-select">
                    <option value="all">All Fields (Title, URL, Details)</option>
                    <option value="minimum">Minimum Fields (Title, URL)</option>
                    <option value="custom">Custom Fields (Basic + Description)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Page Limit:</label>
                <input type="number" id="job-form-limit" min="1" max="50" value="2" />
            </div>
            <div class="button-group">
                <button id="btn-save-job" class="primary-action-btn">Save Job</button>
                <button id="btn-update-job" class="primary-action-btn" style="display: none;">Save Changes</button>
                <button id="btn-cancel-job" class="secondary-btn">Cancel</button>
            </div>
        </div>
    </div>

    <div class="pane-section">
        <div class="section-title-row">
            <h4>Automation Runner</h4>
            <div style="display: flex; gap: 4px; align-items: center;">
                <button id="btn-edit-summary" class="text-toggle-btn">Edit Summary</button>
                <button id="btn-save-summary" class="action-btn-sm primary-action-btn" style="display: none;">Save</button>
                <button id="btn-cancel-summary" class="action-btn-sm secondary-btn" style="display: none;">Cancel</button>
            </div>
        </div>
        <div class="form-group">
            <label>Target Websites:</label>
            <div id="runner-websites-display" class="websites-picker-grid"></div>
            <div id="runner-websites-picker" class="websites-picker-grid" style="display: none;"></div>
            <textarea id="target-websites" rows="2" style="display: none;" placeholder="https://example.com/jobs"></textarea>
        </div>
        <div class="form-group">
            <label>Job Title / Roles:</label>
            <div id="runner-roles-display" class="summary-value-box"></div>
            <input type="text" id="target-roles" style="display: none;" placeholder="Java, Frontend" />
        </div>
        <div class="form-group">
            <label>Page Limit:</label>
            <div id="runner-limit-display" class="summary-value-box"></div>
            <input type="number" id="pagination-limit" style="display: none;" min="1" max="50" value="2" />
        </div>
        <div class="form-group">
            <label>Profile Used:</label>
            <div id="runner-profile-display" class="summary-value-box"></div>
            <select id="runner-profile-select" class="form-select" style="display: none;">
                <option value="">Default Profile</option>
            </select>
        </div>
        <div id="runner-profile-details-container" style="display: none; border: 1px solid var(--border-subtle); border-radius: 6px; padding: 8px; margin-bottom: 8px; background: #f8fafc;">
            <h5 style="margin: 0 0 6px 0; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--text-muted);">Profile Fields</h5>
            <div class="form-group">
                <label>First Name:</label>
                <input type="text" id="sum-prof-firstname" />
            </div>
            <div class="form-group">
                <label>Last Name:</label>
                <input type="text" id="sum-prof-lastname" />
            </div>
            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" id="sum-prof-email" />
            </div>
            <div class="form-group">
                <label>Phone Number:</label>
                <input type="tel" id="sum-prof-phone" />
            </div>
            <div class="form-group">
                <label>Location:</label>
                <input type="text" id="sum-prof-location" />
            </div>
            <div class="form-group">
                <label>Headline:</label>
                <input type="text" id="sum-prof-headline" />
            </div>
            <div class="form-group">
                <label>Target Roles:</label>
                <input type="text" id="sum-prof-roles" />
            </div>
            <div class="form-group">
                <label>Portfolio Links:</label>
                <textarea id="sum-prof-links" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label>Skills:</label>
                <input type="text" id="sum-prof-skills" />
            </div>
        </div>
        <div id="runner-profile-details-display" class="profile-grid" style="margin-bottom: 8px;"></div>
        <div class="button-group">
            <button id="start-automation" class="primary-action-btn">Start Automation</button>
            <button id="stop-automation">Stop</button>
        </div>
        <div id="automation-status" class="status-box">Ready</div>
        <p id="status"></p>
    </div>
</div>

<div id="tab-websites" class="tab-pane" style="display: none;">
    <div class="pane-section">
        <div class="section-title-row">
            <h4>Embedded Platforms & Selectors</h4>
            <span id="platform-count-badge" class="count-tag">0 platforms</span>
        </div>
        <div id="platforms-registry-list" class="platforms-list accordion-list"></div>
    </div>

    <div class="pane-section">
        <h4>System & Dashboard</h4>
        <button id="open-pwa-btn" class="primary-action-btn">Open Dashboard</button>
        <button id="clear-db" data-i18n="clearDatabase">Clear Vacancies Database</button>
    </div>
</div>

<div id="tab-profile" class="tab-pane" style="display: none;">
    <div class="pane-section">
        <h4>User Profile</h4>
        <div class="form-group">
            <label>First Name:</label>
            <input type="text" id="prof-firstname" placeholder="First Name" />
        </div>
        <div class="form-group">
            <label>Last Name:</label>
            <input type="text" id="prof-lastname" placeholder="Last Name" />
        </div>
        <div class="form-group">
            <label>Email Address:</label>
            <input type="email" id="prof-email" placeholder="user@example.com" />
        </div>
        <div class="form-group">
            <label>Phone Number:</label>
            <input type="tel" id="prof-phone" placeholder="+1 234 567 890" />
        </div>
        <div class="form-group">
            <label>Location (City, Country):</label>
            <input type="text" id="prof-location" placeholder="Vilnius, Lithuania" />
        </div>
        <div class="form-group">
            <label>Job Title / Primary Role / Headline:</label>
            <input type="text" id="prof-headline" placeholder="Senior Software Engineer" />
        </div>
        <div class="form-group">
            <label>Target Roles (comma-separated):</label>
            <input type="text" id="prof-roles" placeholder="React, Frontend, TypeScript" />
        </div>
        <div class="form-group">
            <label>Portfolio</label>
            <textarea id="prof-links" rows="2"></textarea>
        </div>
        <div class="form-group">
            <label>Key Skills (comma-separated):</label>
            <input type="text" id="prof-skills" placeholder="JavaScript, Node.js, Docker, React" />
        </div>
        <button id="save-profile-btn" class="primary-action-btn">Save Profile</button>
        <div id="profile-save-status" class="status-box" style="display: none;"></div>
    </div>
</div>

<script type="module" src="popup.js"></script>
</body>
</html>

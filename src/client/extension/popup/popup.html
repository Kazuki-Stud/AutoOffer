<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AutoOffer Popup</title>
    <link rel="stylesheet" href="popup.css">
    <script src="../kit.js" defer></script>
</head>
<body>
<div class="header-container">
    <h3 data-i18n="popupTitle">AutoOffer</h3>
    <div class="lang-container">
        <select id="lang-select">
            <option value="en">EN</option>
            <option value="lt">LT</option>
            <option value="ru">RU</option>
        </select>
    </div>
</div>

<div class="automation-section">
    <h4>Add Website</h4>
    <div class="form-group">
        <label>Job Search or Platform URL:</label>
        <div class="inline-input-group">
            <input type="text" id="quick-website-url" placeholder="https://example.com/jobs" />
            <button id="add-website-btn">Add</button>
        </div>
    </div>
    <div id="manual-selector-fallback" class="manual-selector-box" style="display: none;">
        <label>Search Input Selector Required:</label>
        <p class="helper-text">Search field was not automatically detected. Please specify its CSS selector:</p>
        <div class="inline-input-group">
            <input type="text" id="manual-search-selector" placeholder="input#q, input[name='search']" />
            <button id="save-manual-selector-btn">Save</button>
        </div>
    </div>
</div>

<div class="automation-section">
    <div class="section-header-toggle">
        <h4>Saved Platforms</h4>
        <button id="toggle-platforms-btn" class="text-toggle-btn">View All</button>
    </div>
    <div id="platforms-registry-list" class="platforms-list" style="display: none;"></div>
</div>

<div class="automation-section">
    <h4>Automation Runner</h4>
    <div class="form-group">
        <label>Websites (one URL per line):</label>
        <textarea id="target-websites" rows="2" placeholder="https://example.com/jobs"></textarea>
    </div>
    <div class="form-group">
        <label>Roles (comma-separated):</label>
        <input type="text" id="target-roles" placeholder="Java, Frontend" />
    </div>
    <div class="form-group">
        <label>Target Page Limit:</label>
        <input type="number" id="pagination-limit" min="1" max="50" value="2" />
    </div>
    <div class="button-group">
        <button id="start-automation">Start Automation</button>
        <button id="stop-automation">Stop</button>
    </div>
</div>

<button id="open-pwa-btn" class="primary-action-btn">Open PWA Dashboard</button>
<button id="add-site" data-i18n="addSite">Add Current Site</button>
<button id="auto-guess" data-i18n="autoGuess">Auto-Guess Selectors</button>
<button id="clear-db" data-i18n="clearDatabase">Clear database</button>

<div id="automation-status" class="status-box">Ready</div>
<p id="status"></p>

<script type="module" src="popup.js"></script>
</body>
</html>

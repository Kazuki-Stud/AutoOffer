<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AutoOffer Popup</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="header-container">
    <h3 data-i18n="popupTitle">AutoOffer</h3>
    <div class="lang-container">
        <select id="lang-select">
            <option value="en">EN</option>
            <option value="lt">LT</option>
            <option value="ru">RU</option>
        </select>
    </div>
</div>
<button id="run-task" data-i18n="runTask">Run Parse Task</button>
<button id="add-site" data-i18n="addSite">Add Current Site</button>
<button id="clear-db" data-i18n="clearDatabase">Clear database</button>
<p id="status"></p>
<script type="module" src="popup.js"></script>
</body>
</html>

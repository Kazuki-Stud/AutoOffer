name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            src/client/extension/package-lock.json
            src/client/pwa/package-lock.json

      - name: Install extension dependencies
        run: npm ci
        working-directory: src/client/extension

      - name: Install PWA dependencies
        run: npm ci
        working-directory: src/client/pwa

      - name: Build PWA
        run: npm run build
        working-directory: src/client/pwa

      - name: Verify required PWA assets in dist
        working-directory: src/client/pwa
        run: |
          for f in index.html manifest.webmanifest sw.js image.svg icon-192.png icon-512.png; do
            test -f "dist/$f" || { echo "Missing required PWA asset: dist/$f"; exit 1; }
          done

      - name: List dist (debug)
        run: find src/client/pwa/dist -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/client/pwa/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

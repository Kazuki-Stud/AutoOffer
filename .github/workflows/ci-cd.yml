name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "src/server/AutoOffer/**"
      - ".github/workflows/ci-cd.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/server/AutoOffer/**"
      - ".github/workflows/ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PROJECT_DIR: src/server/AutoOffer
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/autooffer-server

jobs:
  quality-gate:
    name: Checkstyle, Tests & JaCoCo (>= 80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"
          cache: gradle
          cache-dependency-path: |
            src/server/AutoOffer/build.gradle
            src/server/AutoOffer/gradle.properties
            src/server/AutoOffer/gradle/**

      - name: Make gradlew executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Run Checkstyle, Unit/Integration Tests & JaCoCo Gate
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew check --no-daemon --no-configuration-cache

      - name: Upload test & JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            src/server/AutoOffer/build/reports/tests
            src/server/AutoOffer/build/reports/jacoco
            src/server/AutoOffer/build/reports/checkstyle

  dependency-scan:
    name: Filesystem & Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: ${{ env.PROJECT_DIR }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  build-scan-and-push:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest
    needs: [quality-gate, dependency-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image locally for security scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Run Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified Docker image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          file: ${{ env.PROJECT_DIR }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs: [build-scan-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Compose & infrastructure configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "src/server/AutoOffer/docker-compose.yml,src/server/AutoOffer/docker"
          target: "~/autooffer"
          strip_components: 3

      - name: Write runtime secrets & roll out via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SUPERUSER: ${{ secrets.DB_SUPERUSER }}
          DB_SUPERUSER_PASSWORD: ${{ secrets.DB_SUPERUSER_PASSWORD }}
          DB_MIGRATOR_USER: ${{ secrets.DB_MIGRATOR_USER }}
          DB_MIGRATOR_PASSWORD: ${{ secrets.DB_MIGRATOR_PASSWORD }}
          DB_APP_USER: ${{ secrets.DB_APP_USER }}
          DB_APP_PASSWORD: ${{ secrets.DB_APP_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEVICE_TOKEN_PEPPER: ${{ secrets.DEVICE_TOKEN_PEPPER }}
          CH_DB: ${{ secrets.CH_DB }}
          CH_USER: ${{ secrets.CH_USER }}
          CH_PASSWORD: ${{ secrets.CH_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: >
            APP_IMAGE,SERVER_PORT,DB_NAME,DB_SUPERUSER,DB_SUPERUSER_PASSWORD,
            DB_MIGRATOR_USER,DB_MIGRATOR_PASSWORD,DB_APP_USER,DB_APP_PASSWORD,
            JWT_SECRET,DEVICE_TOKEN_PEPPER,CH_DB,CH_USER,CH_PASSWORD,
            GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            cd ~/autooffer
            umask 077
            cat > .env <<EOF
            APP_IMAGE=${APP_IMAGE}
            SERVER_PORT=${SERVER_PORT:-8080}
            SPRING_PROFILES_ACTIVE=prod
            DB_NAME=${DB_NAME}
            DB_SUPERUSER=${DB_SUPERUSER}
            DB_SUPERUSER_PASSWORD=${DB_SUPERUSER_PASSWORD}
            DB_MIGRATOR_USER=${DB_MIGRATOR_USER}
            DB_MIGRATOR_PASSWORD=${DB_MIGRATOR_PASSWORD}
            DB_APP_USER=${DB_APP_USER}
            DB_APP_PASSWORD=${DB_APP_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            JWT_EXPIRATION_MS=86400000
            DEVICE_TOKEN_PEPPER=${DEVICE_TOKEN_PEPPER}
            CH_DB=${CH_DB}
            CH_USER=${CH_USER}
            CH_PASSWORD=${CH_PASSWORD}
            GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
            GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
            EOF
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
            docker compose pull app
            docker compose up -d --remove-orphans
            for i in $(seq 1 20); do
              if curl -fsS "http://localhost:${SERVER_PORT:-8080}/actuator/health/readiness"; then
                exit 0
              fi
              sleep 3
            done
            echo "Readiness check timed out" >&2
            exit 1

name: Backend CI/CD

on:
push:
branches: ["main"]
paths:
- "src/server/AutoOffer/**"
- "docs/api/**"
- ".github/workflows/backend-ci.yml"
pull_request:
paths:
- "src/server/AutoOffer/**"
- "docs/api/**"

permissions:
contents: read
packages: write
security-events: write

jobs:
quality-and-tests:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-root-directory: src/server/AutoOffer

      - name: Run Checkstyle, tests, and JaCoCo coverage gate (>= 80%)
        working-directory: src/server/AutoOffer
        run: ./gradlew check --no-daemon --no-configuration-cache

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: src/server/AutoOffer/build/reports/jacoco/test/

      - name: Setup Node for OpenAPI & npm audit checks
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit PWA & Extension dependencies (high/critical)
        run: |
          npm audit --audit-level=high --prefix src/client/pwa
          npm audit --audit-level=high --prefix src/client/extension

build-push-and-scan:
needs: quality-and-tests
runs-on: ubuntu-latest
outputs:
image_tag: ${{ steps.meta.outputs.tags }}
steps:
- name: Checkout
uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/autooffer-server
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: src/server/AutoOffer
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          tags: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.meta.outputs.tags || 'autooffer-server:ci' }}

      - name: Scan image for CRITICAL/HIGH CVEs (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('ghcr.io/{0}/autooffer-server:latest', github.repository_owner) || 'autooffer-server:ci' }}
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

deploy:
needs: build-push-and-scan
if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
runs-on: ubuntu-latest
steps:
- name: Deploy updated container via SSH
uses: appleboy/ssh-action@v1.2.0
with:
host: ${{ secrets.DEPLOY_HOST }}
username: ${{ secrets.DEPLOY_USER }}
key: ${{ secrets.DEPLOY_SSH_KEY }}
script: |
cd "${{ vars.DEPLOY_PATH }}"
echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
docker compose pull app
docker compose up -d --remove-orphans

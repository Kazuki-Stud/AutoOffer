<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoOffer Hub</title>
    <link rel="manifest" href="/assets/manifest-CQvfWrVk.webmanifest">
    <script src="kit.js" defer></script>
  <script type="module" crossorigin src="/assets/index-DyYsixmc.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-BMSKLGnC.css">
</head>
<body>
<div class="layout-container">
    <header class="app-header">
        <div class="header-main">
            <h2>AutoOffer PWA Hub</h2>
            <div class="header-controls">
                <input type="text" id="extension-id-input" placeholder="Extension ID (for sync)" />
                <button id="sync-btn" class="primary-btn">Sync from Extension</button>
            </div>
        </div>
        <div class="search-filter-bar">
            <input type="text" id="filter-input" placeholder="Search vacancies or keywords..." />
            <span id="sync-status" class="sync-status-indicator">Idle</span>
        </div>
    </header>

    <div class="stats-wrapper">
        <ao-stats id="dashboard-stats"></ao-stats>
    </div>

    <main class="content-area">
        <div id="vacancies-grid" class="vacancies-grid"></div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <p>No vacancies currently synchronized. Enter your Extension ID and click "Sync from Extension".</p>
        </div>
    </main>

    <ao-modal id="vacancy-modal"></ao-modal>
</div>

</body>
</html>
